name: Deploy Playground
on:
  workflow_dispatch:
  push:
    branches: [main, codex/debug-server-memory]
    # paths:
    # - "./.playground/**"
  pull_request:
    branches: [main]

# Both branches deploy to the same server; don't overlap installs/builds.
concurrency:
  group: troll-ui-server-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Transfer backend files via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "./.playground"
          #target: ${{vars.SERVER_PATH}}
          target: "~/apps/ui/"
          strip_components: 2
  build:
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: SSH to install dependencies and build
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            set -euo pipefail
            cd ~/apps/ui
            export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
            . "$NVM_DIR/nvm.sh"
            nvm use
            test "$(node --version)" = "v$(cat .nvmrc)"
            export TROLL_UI_LAYER_REF="${{ github.event.pull_request.head.sha || github.sha }}"
            echo "Building troll-ui layer commit: $TROLL_UI_LAYER_REF"
            echo "Replacing package.json..."
            rm -f package.json
            cp package.prod.json package.json
            bash scripts/build-with-diagnostics.sh
  restart:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Restart PM2 process
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            set -euo pipefail
            cd ~/apps/ui
            export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
            . "$NVM_DIR/nvm.sh"
            nvm use
            test "$(node --version)" = "v$(cat .nvmrc)"
            echo "Restarting PM2 process..."
            pm2 restart troll-ui --update-env
