name: Deploy Playground
on:
  workflow_dispatch:
  push:
    branches: [main]
    # paths:
    # - "./.playground/**"
  pull_request:
    branches: [main]

# Deployments share one server; serialize installs and builds.
concurrency:
  group: troll-ui-server-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Transfer backend files via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "./.playground"
          #target: ${{vars.SERVER_PATH}}
          target: "~/apps/ui/"
          strip_components: 2
  build:
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: SSH to install dependencies and build
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            set -euo pipefail
            cd ~/apps/ui
            export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
            . "$NVM_DIR/nvm.sh"
            nvm use
            test "$(node --version)" = "v$(cat .nvmrc)"
            echo "Replacing package.json..."
            rm -f package.json
            cp package.prod.json package.json
            echo "Installing dependencies..."
            npm install --include=dev
            echo "Building Nuxt app..."
            npm run build
  restart:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Restart PM2 process
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            set -euo pipefail
            cd ~/apps/ui
            export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
            . "$NVM_DIR/nvm.sh"
            nvm use
            test "$(node --version)" = "v$(cat .nvmrc)"
            echo "Restarting PM2 process..."
            pm2 restart troll-ui --interpreter "$(command -v node)" --update-env
            pm2 save
